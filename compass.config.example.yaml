# compass.config.yaml — example consumer config for compass-core
#
# Copy this file to your project's repo root as compass.config.yaml and fill in
# project-specific values. compass-core's governance skill, validators, templates,
# and SOPs all read from this file.
#
# See claude/skills/governance/config-schema.md for the full reference.

schema: compass-config/v1

org:
  name: acme-corp
  display_name: Acme
  default_license: MIT
  default_branch: main

features:
  id_prefix: F-
  branch_pattern: "feat/{id}-{slug}"
  worktree_pattern: "../{repo}-{slug}"
  commit_prefix: feat

labels:
  source: standards/labels.yaml
  required:
    types: [bug, feature, infrastructure, documentation]
    priorities: [now, next, future]

validators:
  claude_md:
    enabled: true
    required_sections:
      - Critical Rules
      - Standard Operating Procedures
  label_check:
    enabled: true
    enforce_required: true

# Optional. Where the loop SOPs report progress. compass-core never posts
# anywhere itself — these names are substituted into SOP prose so "the team
# channel" resolves to something concrete. Omit the block and the SOPs read as
# plain prose.
channels:
  team: "#eng-internal"      # internal narrative: dev loop, merges, handovers
  public: "#community"       # optional; public-safe copy only, per-post sign-off

versioning:
  manifest: arc-manifest.yaml
  release_title_format: "{repo} v{version} — {description}"
  # deploy_command: "arc upgrade {repo}"   # optional

