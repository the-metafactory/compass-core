# compass pin-check — refuses an unlabelled change to the governance engine
# pin. TEMPLATE. `bun engine/install.ts <dir> --with-ci` renders this into
# .github/workflows/compass-pin-check.yml in the consuming repo, beside
# compass-governance.yml. Nothing runs from templates/.
#
# THIS IS A SEPARATE WORKFLOW FILE FROM compass-governance.yml, ON PURPOSE
# --------------------------------------------------------------------------
# (the-metafactory/compass-core#41, PR #52 round-2 review, G1.) It was a job
# inside compass-governance.yml at first. That job needed `labeled`/
# `unlabeled` added to the trigger's `types:` (F3) so that adding the
# `pin-bump` label actually re-ran it — but GitHub fires `types:` at the
# WORKFLOW level, not per job, so governance's OWN job started a fresh run on
# every label event too. Skipping governance on a pure label event with a
# job-level `if:` looked harmless (a label doesn't change any file, so the
# result should be the same either way) but wasn't: GitHub reports a SKIPPED
# job's status as "Success", and a required check that shows success does not
# block a merge — full stop, whether or not anything about the PR actually
# passed. The attack this opened: a PR with a real, planted leak shows
# `governance` red under its normal run; the author (or anyone with triage,
# possibly an agent) adds any label; the NEWEST `governance` check on that
# same commit is the skipped, "successful" one; the PR merges. That is
# strictly worse than the bug #41 exists to close — a governance bypass that
# needs no code review of the workflow file at all, just one label click.
#
# The fix is this file. `compass-governance.yml` goes back to the PLAIN
# default `pull_request_target` trigger (opened/synchronize/reopened, no
# `types:` override, no job-level `if:` on the event action) — a label event
# no longer starts a new run of it at all, so there is no skipped
# "successful" governance to race against a real red one. THIS workflow is
# the only one with `labeled`/`unlabeled` in its trigger, because it is the
# only one that needs to re-evaluate when the label changes, and its own
# skip/success semantics don't matter: there is no OTHER check with this same
# name that a label event could accidentally launder past red.
#
# PIN-SENSITIVE PATHS NOW INCLUDE THIS FILE
# -------------------------------------------
# `engine/validators/pin-check.ts`'s PIN_SENSITIVE_PATHS (and this file's own
# shell logic below) both watch `templates/workflows/compass-pin-check.yml`
# and `.github/workflows/compass-pin-check.yml` the same way they watch
# compass-governance.yml — deleting THIS file, or editing it to stop
# checking what it checks, is exactly as sensitive as editing the pin
# directly, and needs `pin-bump` too.
#
# WHY `pull_request_target` HERE TOO
# ------------------------------------
# Same reason as compass-governance.yml: this event resolves entirely from
# the file as it exists on the repository's DEFAULT branch (GitHub: "this
# event will only trigger a workflow run if the workflow file exists on the
# default branch"), so a PR editing its own copy of this file — including
# deleting the job, or editing what paths it watches — has zero effect on
# the run that gates it. This job checks out NOTHING from the PR as a
# working tree; it only needs the changed-PATH list, which a `git diff`
# against a fetched commit provides without ever writing a PR file to disk.
#
# See compass-governance.yml's own header for the rest of the
# pull_request_target hardening notes (secrets, permissions, the denylist
# fork condition) — they apply to that file, not this one, since this job
# reads no PR file content and uses no secret beyond the ambient token.

name: compass pin-check

on:
  pull_request_target:
    # labeled/unlabeled deliberately included here, and ONLY here — see the
    # header above for why splitting this out of compass-governance.yml was
    # the fix, not a job-level `if:` inside a workflow that also needs the
    # plain default types.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pin-check:
    name: pin-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GIT PLUMBING ONLY — this check no longer reads any FILE content (PR
      # #52 review, F1 made it path-based), so it doesn't check out the PR
      # head as a working tree at all. It only needs the changed-path LIST,
      # which a diff inside this one checkout provides once HEAD_SHA is
      # fetched into it.
      - name: Check out the default branch (git history only, for the diff below)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: refuse a pin-sensitive path changed without the pin-bump label
        # HAS_PIN_BUMP_LABEL is computed by the `contains()` expression, not
        # interpolated PR text — the only thing that reaches the shell below
        # is the literal string "true" or "false". See
        # engine/validators/pin-check.ts's own header for why this shell
        # reimplements, rather than invokes, that file's evaluatePinChange
        # (unit-tested there; the pin cannot yet point at a commit that
        # includes it) — kept identical to it in substance: same watched
        # paths and prefix, same --no-renames diff.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HAS_PIN_BUMP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'pin-bump') }}
        run: |
          set -euo pipefail

          # base/ has persist-credentials: false (see its checkout step
          # above); this fetch supplies the token itself, scoped to this one
          # git invocation via a throwaway http.extraheader, rather than
          # leaving a credential helper configured in base/.git/config —
          # same idiom as compass-governance.yml's leak-check step.
          git -C base -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')" \
            fetch --no-tags origin "$HEAD_SHA"

          # --no-renames, same reason as leak-check's diff: a rename of a
          # watched path must show up as BOTH its old and new name in this
          # list, not collapse into a single R entry this loop never sees.
          #
          # -z, load-bearing (#55, PR #52 round-3 review, H1): without it,
          # `--name-only` C-quotes any path with a non-ASCII byte, a tab, a
          # `"` or a control character — same `core.quotePath` default the
          # runner has — so the quoted line no longer starts with
          # `.github/workflows/` and slips past the case pattern below
          # unlabelled. -z also means a literal newline inside a filename
          # can never be mistaken for an entry boundary, which is why the
          # read loop below reads NUL-delimited, never line-delimited.
          git -C base diff --no-renames --name-only -z \
            "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"

          # Deliberately path-based, not value-based (PR #52 review, F1):
          # touching ANY watched path requires the label, regardless of what
          # changed inside — including a diff that deletes this job's own
          # workflow file. The whole .github/workflows/ prefix is watched
          # too (round-2 review, G3), so a PR cannot dodge this by adding a
          # NEW workflow file instead of editing an existing one — a fake
          # `governance`/`pin-check`-named job in a new file is still an edit
          # under a guarded prefix.
          #
          # One NUL-delimited read loop does both the prefix check and the
          # three exact-path checks (#55): the earlier version's second pass
          # used `grep -qxF` line-by-line against the same file, which is
          # exactly the word-splitting/line-splitting exposure -z exists to
          # remove — reintroducing it in a second reader would have made the
          # first fix pointless.
          CHANGED=0
          while IFS= read -r -d '' p; do
            case "$p" in
              .github/workflows/*|templates/workflows/compass-governance.yml|templates/workflows/compass-pin-check.yml|engine/install.ts)
                echo "::notice::pin-sensitive path changed: $p"
                CHANGED=1
                ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"

          if [ "$CHANGED" = "1" ] && [ "$HAS_PIN_BUMP_LABEL" != "true" ]; then
            echo "::error::This PR touches a pin-sensitive path (a .github/workflows/ file, the governance/pin-check templates, or engine/install.ts) without the 'pin-bump' label. Pin changes are admin-merged after review — add the 'pin-bump' label to this PR; that will re-run this check."
            exit 1
          fi

          if [ "$CHANGED" = "1" ]; then
            echo "Pin-sensitive path(s) changed and this PR is labelled pin-bump — OK, admin review required before merge."
          else
            echo "No pin-sensitive path changed in this PR."
          fi
