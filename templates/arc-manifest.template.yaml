# arc-manifest.yaml -- arc package manifest
# Generic template shipped by compass-core.
# {{config:...}} placeholders come from compass.config.yaml.
# {{template:...}} placeholders come from the template-instantiation context (see config-schema.md → "Template inputs").

name: "{{template:package_name}}"             # Package name (matches repo name by default)
version: "0.1.0"                              # Semantic version (bumped on each release)
description: "{{template:repo_description}}"  # One-line description
author:
  name: "{{template:author_name}}"
  github: "{{template:author_github}}"
repository: "{{config:org.name}}/{{template:repo_name}}"
license: "{{config:org.default_license}}"

# Installation hooks (optional)
# postinstall: "./scripts/postinstall.sh"

# Binary entries (optional -- creates ~/bin/{name} symlinks)
# bin:
#   - name: "{cli_name}"
#     path: "./dist/{cli_name}"

# Dependencies (optional)
# dependencies:
#   - name: "another-package"
#     version: ">=0.1.0"
