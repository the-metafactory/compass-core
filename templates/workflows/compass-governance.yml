# compass governance — PR gate template.
#
# TEMPLATE. `bun engine/install.ts <dir> --with-ci` renders this into
# .github/workflows/compass-governance.yml in the consuming repo. Nothing runs
# from templates/.
#
# THE CONSUMING REPO DOES NOT CONTAIN THE ENGINE
# -----------------------------------------------
# Earlier revisions of this template ran `bun engine/validators/*.ts` against
# the checkout, which only ever worked inside compass-core itself: a consuming
# repo installs rendered SOPs and a CLAUDE.md block, not engine/. The same
# mistake made `bun install --frozen-lockfile` install the CONSUMER's
# dependencies and then expect compass-core's.
#
# So this workflow checks compass-core out separately, into ./.compass-engine,
# installs ITS dependencies there, and runs the validators from that checkout
# against the files of the repo being gated. The consuming repo needs no engine,
# no bun manifest, and no toolchain of its own — only that CI can fetch two
# public repos.
#
# THE PIN IS RENDERED AT INSTALL TIME, AND YOURS TO BUMP
# ------------------------------------------------------
# The compass-core checkout is pinned to an exact commit, written in by the
# installer. That is deliberate: a governance gate that silently follows
# someone else's main is not a gate. Upgrading is an edit to this file — bump
# the SHA, read what changed, land it in a PR like any other change. Re-running
# the installer from a newer compass-core re-renders the pin.
#
# A PR CANNOT CHANGE THE WORKFLOW OR THE PIN THAT GATES IT
# ----------------------------------------------------------
# (the-metafactory/compass-core#41). This job runs on `pull_request_target`,
# not `pull_request`: GitHub resolves a pull_request_target-triggered
# workflow, and every value inside it — including the `ref:` on the
# compass-core checkout below — from the file as it exists on the BASE
# branch, never the PR head's own copy. A PR editing its own copy of this
# file, including repointing the pin to an older, weaker engine, has zero
# effect on the run that gates it. Two things follow from that, and both are
# applied below — see GitHub's own hardening guidance for pull_request_target
# ("Keeping your GitHub Actions and workflows secure: Preventing pull_request_target
# workflows from accessing secrets and writing to the repository"):
#
#   1. This job NEVER checks out `github.event.pull_request.head.sha` (the PR
#      author's own commits) into the default working directory, and NEVER
#      executes anything from it. The one step that touches the PR head at
#      all (leak-check, which has to look at the PR's OWN changed files to
#      scan them) checks it out to an isolated `pr-head/` directory with
#      `persist-credentials: false`, and every validator reads paths under
#      that directory as TEXT — `bun <engine path> pr-head/<file>` — never as
#      something invoked, sourced, `bun install`'d, or given a hook to run.
#      Read the file; never run the file.
#   2. `permissions:` is the minimum this job needs — `contents: read` to
#      check things out, `issues: read` because label-check lists the repo's
#      labels. Nothing here writes to the repository, comments on the PR, or
#      needs any other scope, and pull_request_target's ambient token is
#      privileged enough that an unused scope left in is a real difference,
#      not a formality.
#
# A CONSEQUENCE WORTH SAYING OUT LOUD: under `pull_request`, a fork PR never
# saw `secrets.CONFIDENTIALITY_DENYLIST` or a token with any real reach — the
# leak-check step below used to comment on that ("Secrets are not exposed to
# fork PRs"). That is no longer true. `pull_request_target` hands this job
# the SAME secrets and the SAME token for a fork PR as for a same-repo one —
# that is the whole point of the event (the base branch's code and secrets,
# regardless of who opened the PR) and also exactly why rule 1 above is not
# optional: with every PR now getting real secrets, "never run PR code with
# them" is the entire safety margin.
#
# A SEPARATE CHECK REFUSES AN UNLABELLED PIN CHANGE (compass-core#41, ruling
# item 2). pull_request_target already stops a PR from being gated by its OWN
# chosen pin — but a maintainer can still merge a PR that changes the pin
# (deliberately or by reviewing past it), and that pin then governs EVERY
# subsequent PR. `pin-check`, the second job below, refuses any PR that edits
# the `ref:` on the compass-core checkout unless it carries the `pin-bump`
# label — a functional label (not one of this repo's type/priority labels),
# created once with `gh label create pin-bump ...`. A labelled, pin-changing
# PR is not auto-merged by anything here: the label signals "this needs a
# human to read the diff and admin-merge it," same as any other pin bump.
# pin-check re-implements the small extraction-and-compare in shell rather
# than calling the pin-check module (validators/pin-check.ts, under engine/)
# from .compass-engine — see that file's own header for why (a pin cannot
# point at a commit that doesn't exist on main yet, and the module is new).
#
# CONFIDENTIALITY_DENYLIST_FILE — READ THIS BEFORE WIRING THE SECRET
# -------------------------------------------------------------------
# The scanner's variable was renamed from CONFIDENTIALITY_DENYLIST, which is
# the name sops/confidentiality-gate.md (§0, §2) gives an org secret carrying
# the HASHED denylist payload, consumed by a gate engine that also reads a
# pepper secret. This repo implements only the SOP's PLAINTEXT "local gate"
# tier: leak-check wants a file of plaintext regexes, one per line. One name
# across two contracts was a fail-open, not a wart — a SOP-shaped hashed
# payload fed to the old name produced "pattern file not found", a warning, and
# exit 0, green on exactly the terms the operator meant to guard. The SOP keeps
# CONFIDENTIALITY_DENYLIST for its payload; the scanner reads
# CONFIDENTIALITY_DENYLIST_FILE, a path.
#
# The GitHub *secret* below is still whatever your org named it, and this job
# treats its contents as PLAINTEXT regexes. Wire the hashed payload into it and
# you get a readable file of hashes: every line a valid regex matching nothing.
# --require-patterns will not save you there — it catches an absent or
# unreadable file, not a well-formed file of the wrong kind.
#
# --require-patterns IS THE CI DEFAULT
# -------------------------------------
# Set below, on purpose. In CI a missing pattern file means the gate is running
# degraded, and a degraded security gate reporting green is worse than a red
# one. The local pre-commit hook deliberately does NOT do this — see the
# FAIL-OPEN note in .githooks/pre-commit: a hook that bricks every commit for a
# reason unrelated to the commit gets deleted, and a deleted hook protects
# nothing. Different blast radius, different default.
#
# Arm the local hook once per clone:  git config core.hooksPath .githooks
#
# Actions and the engine checkout are pinned by commit SHA, not tag. A tag is
# mutable; a security gate that a consumer copies should not be re-pointable by
# whoever can move it.

name: compass governance

on:
  pull_request_target:

permissions:
  contents: read
  issues: read

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      # Checked out for GIT PLUMBING ONLY — computing the PR's changed-file
      # list needs both commits' objects in one authenticated clone (private
      # repos need the token for that fetch; persist-credentials: false on
      # pr-head below deliberately removes it there). No validator reads a
      # FILE out of this directory; every validator reads from pr-head/. This
      # is not "the workflow's own trust anchor" in any special sense —
      # GitHub already sources the workflow FILE (trigger, pin, every step)
      # from the base branch via the pull_request_target event itself, not
      # from this checkout.
      - name: Check out the base branch (git history only, for the diff below)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: base
          fetch-depth: 0

      - name: Check out the PR head as DATA ONLY (never executed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Check out the compass-core engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: the-metafactory/compass-core
          ref: {{template:compass_core_ref}} # compass-core pin, rendered at install time
          path: .compass-engine
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install engine dependencies
        working-directory: .compass-engine
        run: bun install --frozen-lockfile

      - name: claude-md-check
        # Reads the PR's OWN proposed CLAUDE.md and compass.config.yaml — data
        # under pr-head/, opened and parsed by the pinned engine, never run.
        run: |
          bun .compass-engine/engine/validators/claude-md-check.ts pr-head/CLAUDE.md \
            --config pr-head/compass.config.yaml

      - name: label-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .compass-engine/engine/validators/label-check.ts "${{ github.repository }}" \
            --config pr-head/compass.config.yaml

      - name: leak-check (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DENYLIST: ${{ secrets.CONFIDENTIALITY_DENYLIST }}
        run: |
          set -euo pipefail

          # --require-patterns only when a denylist is actually reachable.
          # Every PR gets this job's real secrets now (pull_request_target,
          # see the file header) — the old "fork PRs run reduced" distinction
          # no longer applies; this branch only handles the org simply not
          # having wired the secret up yet.
          REQUIRE=""
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export CONFIDENTIALITY_DENYLIST_FILE="$RUNNER_TEMP/denylist.txt"
            REQUIRE="--require-patterns"
          else
            echo "::notice::No denylist secret available to this run — built-in rules only."
          fi

          # Both commits' objects have to exist in ONE repo to diff them. base/
          # is the authenticated checkout (persist-credentials left at its
          # default so this fetch works on a private repo too); fetching
          # HEAD_SHA into it — git objects only, nothing here executes
          # anything from the tree — is enough for `git diff` to find their
          # merge-base itself via `A...B` diff syntax. pr-head/ is never
          # fetched into or diffed FROM: it is read from, below, as data.
          git -C base fetch --no-tags origin "$HEAD_SHA"

          # --no-renames + R in the filter, deliberately, and both are load-
          # carrying: without them a rename-plus-edit is reported as a single R
          # entry, ACM drops it, and the renamed file — secret and all — is never
          # scanned. Verified: git mv + append a credential produces an EMPTY
          # ACM listing.
          git -C base diff --no-renames --name-only --diff-filter=ACMR -z \
            "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"

          # Paths are relative to pr-head/, which is exactly where the PR's
          # own file contents live — no merge commit to reconstruct, no
          # separate "is it in the merged tree" check: the PR head IS the
          # tree being scanned.
          : > "$RUNNER_TEMP/scan.txt"
          while IFS= read -r -d '' f; do
            case "$f" in .compass-engine/*) continue ;; esac
            if [ -f "pr-head/$f" ]; then
              printf 'pr-head/%s\0' "$f" >> "$RUNNER_TEMP/scan.txt"
            else
              echo "::notice::$f is in the PR diff but not present at the PR head — not scanned."
            fi
          done < "$RUNNER_TEMP/changed.txt"

          if [ ! -s "$RUNNER_TEMP/scan.txt" ]; then
            echo "No added, modified, or renamed files to scan in this PR."
            exit 0
          fi

          # NUL-separated throughout: filenames with spaces or newlines survive
          # intact, and xargs -0 is portable in a way that GNU's -a/-d are not.
          xargs -0 bun .compass-engine/engine/validators/leak-check.ts $REQUIRE \
            < "$RUNNER_TEMP/scan.txt"

  pin-check:
    # Separate job, separate status check: a PR that fails ONLY pin-check
    # (governance itself is green — it ran main's workflow and main's pin,
    # completely unaffected by whatever the PR's own copy says) should read
    # as exactly that in the PR's checks list, not be folded into governance's
    # pass/fail.
    name: pin-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the base branch (this workflow's own trust anchor)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: base
          persist-credentials: false

      - name: Check out the PR head as DATA ONLY (never executed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: refuse a pin change without the pin-bump label
        # HAS_PIN_BUMP_LABEL is computed by the `contains()` expression, not
        # interpolated PR text — the only thing that reaches the shell below
        # is the literal string "true" or "false". See pin-check.ts's own
        # header for why this shell reimplements, rather than invokes, that
        # file's evaluatePinChange (unit-tested there; the pin cannot yet
        # point at a commit that includes it).
        env:
          HAS_PIN_BUMP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'pin-bump') }}
        run: |
          set -euo pipefail

          # ref: <40-hex> on the compass-core engine checkout step, anchored
          # on the "compass-core pin" comment that line always carries — see
          # the pin-check module's extractWorkflowRef (validators/pin-check.ts,
          # under engine/), which this mirrors exactly.
          extract_workflow_ref() {
            grep -oP '(?<=ref: )[0-9a-f]{40}(?=\s*#.*compass-core pin)' "$1" 2>/dev/null || true
          }
          # const ENGINE_REF = "<40-hex>"; in engine/install.ts — mirrors
          # extractEngineRef. Absent in a consumer repo (no install.ts there),
          # which is fine: the loop below only compares it when the file
          # exists on at least one side.
          extract_engine_ref() {
            grep -oP '(?<=^const ENGINE_REF = ")[0-9a-f]{40}(?=";$)' "$1" 2>/dev/null || true
          }

          WORKFLOW_PATH=".github/workflows/compass-governance.yml"
          BASE_WORKFLOW_REF=$(extract_workflow_ref "base/$WORKFLOW_PATH")
          HEAD_WORKFLOW_REF=$(extract_workflow_ref "pr-head/$WORKFLOW_PATH")

          CHANGED=0
          if [ "$BASE_WORKFLOW_REF" != "$HEAD_WORKFLOW_REF" ]; then
            echo "::notice::$WORKFLOW_PATH engine pin: ${BASE_WORKFLOW_REF:-<absent>} -> ${HEAD_WORKFLOW_REF:-<absent>}"
            CHANGED=1
          fi

          INSTALL_PATH="engine/install.ts"
          if [ -f "base/$INSTALL_PATH" ] || [ -f "pr-head/$INSTALL_PATH" ]; then
            BASE_ENGINE_REF=$([ -f "base/$INSTALL_PATH" ] && extract_engine_ref "base/$INSTALL_PATH" || true)
            HEAD_ENGINE_REF=$([ -f "pr-head/$INSTALL_PATH" ] && extract_engine_ref "pr-head/$INSTALL_PATH" || true)
            if [ "$BASE_ENGINE_REF" != "$HEAD_ENGINE_REF" ]; then
              echo "::notice::$INSTALL_PATH ENGINE_REF: ${BASE_ENGINE_REF:-<absent>} -> ${HEAD_ENGINE_REF:-<absent>}"
              CHANGED=1
            fi
          fi

          if [ "$CHANGED" = "1" ] && [ "$HAS_PIN_BUMP_LABEL" != "true" ]; then
            echo "::error::This PR changes the governance engine pin without the 'pin-bump' label. Pin changes are admin-merged after review — add the label if this is a deliberate bump."
            exit 1
          fi

          if [ "$CHANGED" = "1" ]; then
            echo "Pin change detected and labelled pin-bump — OK, admin review required before merge."
          else
            echo "No pin change in this PR."
          fi
